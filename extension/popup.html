<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      width: 280px;
      margin: 0;
      padding: 0;
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #fafaf7;
      color: #1a1c18;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #1a1c18; color: #e8e6dd; }
    }

    .head {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px 10px;
    }
    .logo {
      width: 30px; height: 30px; border-radius: 7px;
      background: linear-gradient(135deg, #0f1419 0%, #16211f 60%, #00a3a3 160%);
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; color: #fff; font-weight: 700;
      flex: 0 0 auto;
    }
    .head h1 { font-size: 14px; margin: 0; font-weight: 700; letter-spacing: 0.01em; }
    .head .sub { font-size: 10.5px; color: #8891a0; margin: 1px 0 0; }

    .status-row {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin: 0 16px 10px;
      padding: 9px 12px;
      border: 1px solid rgba(15, 20, 25, 0.1);
      border-radius: 9px;
      background: #f3f2ec;
      font-size: 12px;
    }
    @media (prefers-color-scheme: dark) {
      .status-row { background: #262822; border-color: rgba(255, 255, 255, 0.12); }
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
    .connected .dot { background: #2ecc71; box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.18); }
    .connecting .dot { background: #f39c12; box-shadow: 0 0 0 3px rgba(243, 156, 18, 0.18); animation: pulse 1s infinite; }
    .disconnected .dot { background: #e74c3c; box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.15); }
    @keyframes pulse { 50% { opacity: 0.35; } }
    .status-row .label { font-weight: 500; }

    .meta {
      margin: 0 16px 10px;
      padding: 8px 12px;
      border: 1px solid rgba(15, 20, 25, 0.08);
      border-radius: 8px;
      font-size: 11px;
    }
    @media (prefers-color-scheme: dark) {
      .meta { border-color: rgba(255, 255, 255, 0.1); }
    }
    .meta .row { display: flex; justify-content: space-between; padding: 3px 0; color: #545c66; }
    @media (prefers-color-scheme: dark) { .meta .row { color: #a8a494; } }
    .meta .row b { font-weight: 600; color: #1a1c18; font-variant-numeric: tabular-nums; }
    @media (prefers-color-scheme: dark) { .meta .row b { color: #e8e6dd; } }

    .actions { padding: 0 16px 14px; display: flex; flex-direction: column; gap: 7px; }
    button {
      width: 100%; padding: 9px 12px; border: 0; border-radius: 7px;
      font-size: 12.5px; font-weight: 600; cursor: pointer;
      font-family: inherit;
    }
    button:active { transform: translateY(1px); }
    #connect { background: #00a3a3; color: #fff; }
    #connect:hover { background: #008787; }
    #connect.starting { opacity: 0.7; pointer-events: none; }
    #disconnect { background: #fbeae8; color: #b3382c; }
    #disconnect:hover { background: #f7dcd8; }
    @media (prefers-color-scheme: dark) { #disconnect { background: #3a2623; color: #f0a99e; } }
    #settings {
      background: transparent; color: #00a3a3; font-size: 11px;
      text-decoration: underline; padding: 4px;
    }
    .hint { font-size: 10px; color: #8891a0; text-align: center; margin: 0 16px 12px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="head">
    <div class="logo">P</div>
    <div>
      <h1>Pilot</h1>
      <p class="sub">Browser control for agent harnesses</p>
    </div>
  </div>

  <div id="status" class="status-row disconnected">
    <span class="dot"></span>
    <span class="label" id="label">Disconnected</span>
  </div>

  <div class="meta">
    <div class="row"><span>Profile</span><b id="profile">default</b></div>
    <div class="row"><span>Group</span><b id="groupName">Harness</b></div>
    <div class="row"><span>Relay</span><b id="relay">ws://127.0.0.1:8756</b></div>
  </div>

  <div class="actions">
    <button id="connect" hidden>Connect</button>
    <button id="disconnect" hidden>Disconnect</button>
    <button id="settings">Settings</button>
  </div>
  <p class="hint" id="hint" hidden>Connect starts the relay if needed, then handshakes.</p>

  <script src="popup.js"></script>
</body>
</html>
