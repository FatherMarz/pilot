<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; }
    body {
      width: 260px;
      font-family: -apple-system, "Segoe UI", sans-serif;
      padding: 16px;
      margin: 0;
      background: #fafaf7;
      color: #0f1419;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #1a1c18; color: #e8e6dd; }
    }
    h1 { font-size: 14px; margin: 0 0 2px; letter-spacing: 0.01em; }
    .sub { font-size: 11px; color: #8891a0; margin: 0 0 12px; }
    #status {
      display: flex; align-items: center; gap: 7px;
      font-size: 12px; margin: 0 0 12px;
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
    .connected .dot { background: #2ecc71; box-shadow: 0 0 0 3px rgba(46,204,113,.2); }
    .connecting .dot { background: #f39c12; animation: pulse 1s infinite; }
    .disconnected .dot { background: #e74c3c; }
    @keyframes pulse { 50% { opacity: .35; } }
    .row { display: flex; align-items: center; justify-content: space-between; font-size: 11.5px; margin-bottom: 8px; color: #545c66; }
    .row b { font-weight: 600; color: inherit; }
    button {
      width: 100%; padding: 9px; border: 0; border-radius: 6px;
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
    #connect { background: #00a3a3; color: #fff; }
    #connect:hover { background: #008787; }
    #disconnect { background: #e8e6dd; color: #9b2c2c; }
    #disconnect:hover { background: #f4e3e3; }
    @media (prefers-color-scheme: dark) { #disconnect { background: #2b2d28; } }
    #startRelay { background: #f4f3ee; color: #0f1419; border: 1px solid rgba(15,20,25,.18); }
    #startRelay:hover { background: #ecebe4; }
    @media (prefers-color-scheme: dark) { #startRelay { background: #2b2d28; color: #e8e6dd; } }
    .secondary {
      width: 100%; margin-top: 10px; padding: 6px; border: 0; border-radius: 6px;
      background: transparent; color: #00a3a3; font-size: 11.5px; cursor: pointer; text-decoration: underline;
    }
    .hint { font-size: 10.5px; color: #8891a0; margin-top: 10px; line-height: 1.45; }
  </style>
</head>
<body>
  <h1>Pilot</h1>
  <p class="sub">Browser control for agent harnesses</p>
  <p id="status" class="disconnected"><span class="dot"></span><span id="label">Disconnected</span></p>
  <div class="row"><span>Profile</span><b id="profile">default</b></div>
  <div class="row"><span>Relay</span><b id="relay">ws://127.0.0.1:8756</b></div>
  <button id="connect" hidden>Connect</button>
  <button id="startRelay" hidden>Start relay, then connect</button>
  <button id="disconnect" hidden>Disconnect</button>
  <button id="settings" class="secondary">Settings</button>
  <p class="hint" id="hint" hidden>Connect is the handshake. If the relay isn't running, Pilot starts it for you.</p>
  <script src="popup.js"></script>
</body>
</html>
